version: "3.9"
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ../frontend
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_API_URL=/api

  backend:
    build:
      context: ../backend
    environment:
      # WARNING: the repo-root .env now holds the DEV branch URL. This compose
      # file must be run with DATABASE_URL set to the production Neon branch
      # (e.g. `DATABASE_URL=... docker compose -f docker-compose.prod.yml up`),
      # otherwise prod silently writes to dev.
      - DATABASE_URL=${DATABASE_URL}
      # Neon keep-warm heartbeat (backend/main.py::keep_db_warm). Held the
      # compute awake 24/7 on the default of 240s. Set deliberately here rather
      # than inherited from the code default.
      - RAG_KEEPWARM_INTERVAL_SECONDS=${RAG_KEEPWARM_INTERVAL_SECONDS:-0}
      - REDIS_URL=${REDIS_URL}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_TEXTRACT_KEY=${AWS_TEXTRACT_KEY}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1

  scraper:
    build:
      context: ../backend
    command: python -m app.modules.scraper.pipeline
    profiles: ["scraper"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}

volumes:
  redis-data:
